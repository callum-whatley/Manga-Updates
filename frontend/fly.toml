app = "manga-frontend-cwh"
primary_region = "yyz"

[build]

[env]
  BACKEND_INTERNAL_URL = "http://manga-backend-cwh.internal:5001"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
